version: 1
experiment_id: masked-physical-te-injection-v1
epistemic_class: ADAPTED
status: frozen_synthetic_only
purpose: >-
  Test whether the physical five-degree pure-E bubble template survives a fixed
  cut sky, E/B purification, and frozen polarized foreground nuisance
  deprojection before any observational polarization product is opened.
inputs:
  physical_template: results/bubble-te-template.json
  basis: linear
  template_lmax: 96
  nside: 64
  injection_center_galactic_deg: {longitude: 207.1022727272727, latitude: -57.39952353962295}
  seed: 20260821
  injection_amplitude_sigma: 5.0
mask:
  coordinate_system: Galactic
  rejected_latitude_band_deg: 20.0
  apodization_deg: 5.0
  apodization_type: C2
  accepted_sky_fraction_minimum: 0.55
engines:
  cmb_transfer: {name: CAMB, version: 2.0.3}
  cut_sky_purification: {name: NaMaster, package: pymaster, version: 3.0.1}
  foreground_generator: {name: PySM3, version: 3.4.6, presets: [d1, s1], frequency_ghz: 100.0}
  foreground_amplitudes: {d1: 1.0, s1: 1.0}
statistic:
  polarization: NaMaster-purified E/B alms from unmasked Q/U input and apodized mask
  nuisance: NaMaster deprojection of fixed PySM3 dust and synchrotron Q/U templates
  e_score: inverse-conditional-variance harmonic matched-filter score against the purified processed template
  b_score: same normalized inner product using purified B alms
pass_conditions:
  - processed pure-E template retains at least 80 percent of its full-sky conditional matched-filter signal-to-noise
  - absolute purified B leakage score is below 1 sigma
  - foreground deprojection changes recovered E score by no more than 0.1 sigma
  - accepted sky fraction is at least 0.55
forbidden_claims:
  - observational bubble evidence
  - Planck confirmation
  - foreground-complete sensitivity
  - proof of a multiverse
holdout:
  planck_access: prohibited
  observational_polarization_access: prohibited
notes:
  - Injection amplitude is five full-sky conditional-E sigma before masking.
  - Foreground templates are generated at unit preset amplitude and supplied exactly to the frozen NaMaster deprojection operator.
  - This gate tests mask purification and exact nuisance projection mechanics; it does not establish robustness to foreground model mismatch.
