limitations:
  - Official WMAP says ILC is reliable above about 10 degrees and cautions about smaller-scale bias structure.
  - 128 nulls resolve no p-value below 1/129.
  - ILC foreground residuals require component-separated and frequency-map vetoes.
  - Mask-distance buffer uses conservative pixel-graph expansion.
  - Planck temperature and polarization remain unopened holdouts.
