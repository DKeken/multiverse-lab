    status: unestablished
    evidence: No observation currently establishes a physically accessible second universe or destination region.
  - check: causal_accessibility
    status: unestablished
    evidence: No observation establishes a controllable causal channel to such a destination.
  - check: destination_addressability
    status: undefined
