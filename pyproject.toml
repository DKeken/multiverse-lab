[project]
name = "multiverse-lab"
description = "Constraint-first open research lab for falsifiable multiverse-adjacent physics"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [{name = "Multiverse Lab contributors"}]
keywords = ["cosmology", "cmb", "scientific-method", "symbolic-verification", "open-science"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Physics",
]
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "astropy==7.2.0",
  "healpy>=1.18,<2",
  "jupyterlab>=4.4,<5",
  "jsonschema>=4.23,<5",
  "pyyaml>=6,<7",
  "numpy>=2.2,<3",
  "qutip==5.3.0",
  "scipy>=1.15,<2",
  "sympy==1.14.0",
]

[tool.uv]
package = false
