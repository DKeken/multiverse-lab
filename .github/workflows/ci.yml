name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {enable-cache: true}
      - run: uv sync --frozen
      - run: uv run python -m py_compile src/*.py scripts/check_artifacts.py
      - run: uv run python scripts/check_artifacts.py
  public-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reject large tracked files and private markers
        shell: bash
        run: |
          test -z "$(find . -type f -not -path './.git/*' -size +10M -print -quit)"
          ! grep -R -E 'tail[0-9]+\.ts\.net|/Users/[^/]+|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY' --exclude-dir=.git .
